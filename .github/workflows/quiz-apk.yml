name: Quiz Android debug APK

on:
  push:
    branches: [agent/daily-deen-quiz]
    paths:
      - .github/workflows/quiz-apk.yml
      - quiz/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiz/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install and verify web app
        run: |
          npm ci --prefix quiz
          npm run check --prefix quiz
      - name: Build debug APK
        run: |
          npm run android:sync --prefix quiz
          cd quiz/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-deen-quiz-v1.7-debug-apk
          path: quiz/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
