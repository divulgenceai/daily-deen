<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A source-backed seven-question Islamic quiz with daily streaks and a Sunday weekly review."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Deen Quiz" />
    <title>Daily Deen Quiz</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="./" aria-label="Daily Deen Quiz home">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 6 40 23 58 32 40 41 32 58 24 41 6 32 24 23Z" />
          <path d="M32 16 37 27 48 32 37 37 32 48 27 37 16 32 27 27Z" />
        </svg>
        <span>Daily Deen Quiz</span>
      </a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <button class="nav-link active" type="button" data-dialog="today">Today</button>
        <button class="nav-link" type="button" data-dialog="topics">Topics</button>
        <button class="nav-link" type="button" data-dialog="how">How it works</button>
      </nav>

      <button class="streak-button" id="streakButton" type="button" data-dialog="streak">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.1 21c-4 0-7.1-2.7-7.1-6.5 0-2.1 1-3.8 2.5-5.3 1.7-1.7 3.2-3.2 2.8-6.6 3.2 1.3 5.1 3.9 5.1 6.6 0 .8-.2 1.4.3 1.4.6 0 1.4-.9 1.5-2.9 1.2 1 1.6 2.4 1.6 4.1 0 5-2.6 9.2-6.7 9.2Z" />
        </svg>
        <span><strong id="streakCount">0</strong> day streak</span>
      </button>
    </header>

    <main class="quiz-layout" id="app">
      <aside class="day-rail" aria-label="Today's quiz progress">
        <div class="day-heading">
          <h1 id="dayHeadingTitle">Today’s seven</h1>
          <p id="displayDate">Your local day</p>
        </div>
        <div class="progress-copy"><strong id="progressCount">01</strong><span id="progressTotal">/ 07</span></div>
        <p class="rail-label">Progress</p>
        <ol class="question-steps" id="questionSteps" aria-label="Question progress"></ol>
        <div class="weekday-wrap">
          <div class="weekday-labels" id="weekdayLabels" aria-label="This week's activity"></div>
        </div>
      </aside>

      <section class="quiz-stage" aria-live="polite">
        <div class="mobile-day-heading">
          <div>
            <h1 id="mobileDayHeadingTitle">Today’s seven</h1>
            <p id="mobileDisplayDate">Your local day</p>
          </div>
          <div class="mobile-progress-copy"><strong id="mobileProgressCount">01</strong><span id="mobileProgressTotal">/ 07</span></div>
        </div>
        <div class="mobile-steps" id="mobileSteps" aria-label="Question progress"></div>
        <div id="stageContent"></div>
      </section>

    </main>

    <footer class="site-footer">
      <span>7 questions</span><i aria-hidden="true"></i><span>one attempt</span><i aria-hidden="true"></i><span>sources shown after each answer</span>
    </footer>

    <dialog class="info-dialog" id="infoDialog">
      <form method="dialog" class="dialog-shell">
        <div class="dialog-header">
          <div>
            <span class="dialog-kicker" id="dialogKicker">Daily Deen Quiz</span>
            <h2 id="dialogTitle">How it works</h2>
          </div>
          <button class="close-button" value="close" aria-label="Close dialog" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div id="dialogBody" class="dialog-body"></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js?v=3"></script>
  </body>
</html>
